[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-based-image-retrieval"
version = "0.4.0"
description = "Painting retrieval with submitted Week 1–4 methods, local features and unknown rejection."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==2.4.6",
    "opencv-contrib-python==4.13.0.92",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab",
    "ipykernel",
    "nbconvert",
    "matplotlib>=3.7",
    "pandas",
    "scikit-image>=0.21",
]
test = [
    "pytest",
]

[project.scripts]
cbir = "main:main"

[tool.setuptools]
packages = ["src"]
py-modules = ["main"]
