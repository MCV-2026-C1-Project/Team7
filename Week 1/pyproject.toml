[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-based-image-retrieval"
version = "0.1.0"
description = "Content-based image retrieval using color descriptors."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
]

[project.scripts]
cbir = "main:main"

[tool.setuptools]
packages = ["src"]
py-modules = ["main"]
