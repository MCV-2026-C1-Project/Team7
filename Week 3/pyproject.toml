[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-based-image-retrieval"
version = "0.4.0"
description = "Museum painting retrieval (MCV C1, Team 7, Week 3): denoising, two-painting segmentation, colour + texture descriptors."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
]

[project.scripts]
cbir = "main:main"

[tool.setuptools]
packages = ["src"]
py-modules = ["main"]
